<!DOCTYPE html>
<html lang="zh-CN" data-theme="light"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="错题本">
<title>墨题 · 本地错题本</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700&amp;family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap">
<style>
/* ============================================================
   墨题 · 本地错题本  | 设计方向：墨纸学院（纸 / 墨 / 红笔 / 荧光）
   ============================================================ */
:root{
  --paper:#F4F6F1;
  --paper-2:#ECEFE7;
  --card:#FFFFFF;
  --ink:#171F19;
  --ink-2:#3E483F;
  --muted:#7E887D;
  --faint:#A9B1A8;
  --line:#E4E8DF;
  --line-2:#EEF1EA;
  --brand:#1E5A47;
  --brand-deep:#123B2E;
  --brand-soft:#E3EEE8;
  --accent:#CE5028;
  --accent-soft:#F8E7DF;
  --hi:#F6D778;
  --good:#2E8A54;
  --good-soft:#E2F1E8;
  --fuzzy:#D08A1B;
  --fuzzy-soft:#F9EEDB;
  --bad:#C94637;
  --bad-soft:#F9E5E1;
  --r-lg:18px;
  --r-md:13px;
  --r-sm:9px;
  --shadow:0 8px 26px rgba(24,40,32,.09);
  --shadow-sm:0 2px 10px rgba(24,40,32,.06);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --tab-h:60px;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:var(--sans);color:var(--ink);background:#DDE2DA;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink);}
textarea{resize:none;}
::placeholder{color:var(--faint);}
img{display:block;max-width:100%;}
.hidden{display:none!important;}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;opacity:0!important;}

/* 手机画布（桌面访问时居中成手机宽度） */
#app{
  position:relative;width:100%;max-width:480px;min-height:100vh;margin:0 auto;
  background:var(--paper);box-shadow:0 0 46px rgba(20,30,24,.12);
  padding-bottom:calc(var(--tab-h) + var(--safe-bottom) + 8px);
}
@media(min-width:520px){ body{padding:22px 0;} #app{min-height:calc(100vh - 44px);border-radius:30px;overflow:hidden;} }

/* ---------- 顶部栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-top) + 10px) 16px 10px;
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  background:rgba(244,246,241,.9);
  border-bottom:1px solid var(--line-2);
}
.topbar h1{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.5px;flex:1;}
.topbar .sub{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);flex:none;transition:background .15s;
}
.icon-btn:active{background:var(--paper-2);}
.icon-btn svg{width:21px;height:21px;}
.flat-btn{
  min-height:40px;padding:0 15px;border-radius:999px;background:var(--brand-soft);color:var(--brand);
  font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;flex:none;
}
.flat-btn svg{width:16px;height:16px;}

.view{padding:16px 16px 20px;animation:fade .28s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ---------- 通用组件 ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);border:1px solid var(--line-2);}
.section-title{font-size:13px;color:var(--muted);font-weight:500;margin:20px 4px 10px;display:flex;align-items:center;gap:8px;letter-spacing:.5px;}
.section-title:first-child{margin-top:4px;}
.section-title .line{flex:1;height:1px;background:var(--line);}
.chip{
  display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:999px;font-size:12.5px;
  background:var(--paper-2);color:var(--ink-2);border:1px solid var(--line);
}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500;}
.input,.textarea,.select{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 13px;outline:none;transition:border-color .15s;
}
.input:focus,.textarea:focus,.select:focus{border-color:var(--brand);}
.textarea{min-height:84px;line-height:1.6;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn{
  width:100%;min-height:50px;border-radius:var(--r-md);font-size:15.5px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .15s;
}
.btn:active{transform:scale(.985);}
.btn svg{width:19px;height:19px;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-2);}
.btn-danger{background:var(--bad-soft);color:var(--bad);}
.btn[disabled]{opacity:.45;pointer-events:none;}

/* ---------- 今日 ---------- */
.hero{
  background:linear-gradient(155deg,var(--brand-deep),var(--brand) 78%);
  border-radius:22px;padding:22px 20px;color:#EAF3EE;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.12);}
.hero::before{content:"";position:absolute;right:6px;top:6px;width:120px;height:120px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.08);}
.hero .date-line{font-size:12.5px;opacity:.78;letter-spacing:1px;}
.hero .big-num{font-family:var(--serif);font-size:52px;font-weight:700;line-height:1.1;margin:6px 0 2px;}
.hero .big-num small{font-size:16px;font-weight:400;opacity:.8;margin-left:6px;}
.hero .hint{font-size:13px;opacity:.85;margin-bottom:16px;}
.hero .start{
  background:#fff;color:var(--brand-deep);border-radius:999px;padding:12px 22px;font-weight:600;font-size:15px;
  display:inline-flex;align-items:center;gap:8px;min-height:46px;
}
.hero .start svg{width:18px;height:18px;}
.hero.done{background:linear-gradient(155deg,#23503c,#3a7a5c);}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px;}
.stat-cell{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-md);padding:11px 6px;text-align:center;box-shadow:var(--shadow-sm);}
.stat-cell b{display:block;font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.1;}
.stat-cell span{font-size:11px;color:var(--muted);margin-top:3px;display:block;}

.todo-strip{
  display:flex;align-items:center;gap:11px;background:var(--accent-soft);border:1px solid #f0d2c6;
  border-radius:var(--r-md);padding:12px 14px;margin-top:13px;color:#9c3d1f;font-size:13.5px;
}
.todo-strip svg{width:20px;height:20px;flex:none;}
.todo-strip b{font-weight:600;}

/* ---------- 题目卡片 ---------- */
.q-card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:15px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.q-head .crumb{color:var(--brand);font-weight:500;}
.q-head .dot{width:3px;height:3px;border-radius:50%;background:var(--faint);}
.q-status{margin-left:auto;font-size:11.5px;padding:3px 9px;border-radius:999px;}
.st-inbox{background:var(--fuzzy-soft);color:var(--fuzzy);}
.st-due{background:var(--bad-soft);color:var(--bad);}
.st-ok{background:var(--good-soft);color:var(--good);}
.q-title{font-size:15px;font-weight:500;line-height:1.55;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.q-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);flex:none;background:var(--paper-2);}
.q-main{display:flex;gap:12px;}
.q-main .txt{flex:1;min-width:0;}
.q-foot{display:flex;align-items:center;gap:8px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);}
.q-foot .tags{flex:1;display:flex;gap:6px;flex-wrap:wrap;}
.tag{background:var(--paper-2);border-radius:6px;padding:2px 8px;font-size:11.5px;color:var(--ink-2);}
.mastery{display:inline-flex;align-items:center;gap:5px;font-weight:500;}
.mastery i{width:7px;height:7px;border-radius:50%;display:inline-block;}

/* 空态 */
.empty{text-align:center;padding:54px 26px;color:var(--muted);}
.empty svg{width:56px;height:56px;color:var(--faint);margin-bottom:14px;}
.empty h3{font-family:var(--serif);font-size:17px;color:var(--ink-2);font-weight:600;margin-bottom:7px;}
.empty p{font-size:13.5px;line-height:1.7;}
.empty .btn{margin:20px auto 0;max-width:220px;}

/* 搜索框 */
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:0 15px;height:46px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.searchbar svg{width:18px;height:18px;color:var(--muted);flex:none;}
.searchbar input{border:none;outline:none;flex:1;background:none;}

/* ---------- 底部标签栏 ---------- */
.tabbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:rgba(255,255,255,.93);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);
}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tab-h);color:var(--faint);font-size:10.5px;}
.tab svg{width:23px;height:23px;}
.tab.on{color:var(--brand);font-weight:500;}
.tab.add{position:relative;}
.tab.add .add-circle{
  width:48px;height:48px;border-radius:50%;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;margin-top:-22px;
  box-shadow:0 8px 18px rgba(30,90,71,.36);border:4px solid var(--paper);
}
.tab.add .add-circle svg{width:24px;height:24px;}
.tab.add span{font-size:10.5px;color:var(--faint);}
.tab.add.on .add-circle{background:var(--accent);}

/* ---------- 弹层 / 模态 ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,23,.42);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;}
.overlay.center{align-items:center;padding:24px;}
.sheet{width:100%;max-width:480px;background:var(--paper);border-radius:24px 24px 0 0;padding:8px 18px calc(22px + var(--safe-bottom));max-height:86vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.8,.25,1);}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
.sheet-grip{width:40px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 14px;}
.modal{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:22px;animation:pop .22s;}
@keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:none;opacity:1;}}
.modal h3{font-family:var(--serif);font-size:18px;margin-bottom:8px;}
.modal p{font-size:14px;color:var(--ink-2);margin-bottom:18px;line-height:1.65;}
.modal .row2{gap:10px;}

.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-bottom));transform:translateX(-50%);z-index:120;
  background:var(--brand-deep);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;
  box-shadow:var(--shadow);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:88%;
}
.toast.show{opacity:1;}

/* ---------- 编辑页 ---------- */
.upload-box{
  border:1.6px dashed var(--faint);border-radius:var(--r-lg);background:var(--card);
  padding:24px;text-align:center;color:var(--muted);
}
.upload-box svg{width:34px;height:34px;color:var(--brand);margin-bottom:8px;}
.upload-box b{display:block;color:var(--ink-2);font-size:14.5px;margin-bottom:3px;font-weight:500;}
.upload-box span{font-size:12.5px;}
.img-preview{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--paper-2);}
.img-preview img{width:100%;}
.img-preview .img-actions{display:flex;gap:8px;padding:10px;}
.mini-link{color:var(--brand);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;min-height:36px;}
.mini-link svg{width:16px;height:16px;}

/* ---------- 批注器 ---------- */
.annotate-wrap{position:fixed;inset:0;z-index:80;background:#1c231e;display:flex;flex-direction:column;max-width:480px;margin:0 auto;}
.anno-top{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-top) + 10px) 14px 10px;color:#EAF0EA;}
.anno-top b{flex:1;font-family:var(--serif);font-size:16px;}
.anno-top .icon-btn{color:#EAF0EA;}
.anno-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:10px;touch-action:none;}
#annoCanvas{background:#fff;border-radius:6px;touch-action:none;max-width:100%;box-shadow:0 10px 30px rgba(0,0,0,.4);}
.anno-tools{background:#232c25;border-top:1px solid #33403a;padding:10px 12px calc(12px + var(--safe-bottom));color:#dfe7df;}
.anno-tools .tools{display:flex;gap:6px;justify-content:space-between;margin-bottom:9px;}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#aab6ac;padding:7px 2px;border-radius:10px;min-height:46px;justify-content:center;}
.tool svg{width:21px;height:21px;}
.tool.on{background:var(--brand);color:#fff;}
.anno-row{display:flex;align-items:center;gap:10px;}
.color-dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;flex:none;}
.color-dot.on{border-color:#fff;box-shadow:0 0 0 2px var(--brand);}
.anno-row .sp{flex:1;}
.anno-row button{min-height:40px;padding:0 16px;border-radius:10px;font-size:13.5px;}
#annoSave{background:var(--brand);color:#fff;}
#annoUndo{background:#33403a;color:#dfe7df;}
#annoClear{background:#33403a;color:#dfe7df;}

/* ---------- 复习 ---------- */
.review-wrap{position:fixed;inset:0;z-index:80;background:var(--paper);max-width:480px;margin:0 auto;display:flex;flex-direction:column;}
.rev-top{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-top) + 12px) 16px 10px;}
.rev-progress{flex:1;height:7px;background:var(--paper-2);border-radius:99px;overflow:hidden;}
.rev-progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s;}
.rev-top .timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:38px;text-align:right;}
.rev-body{flex:1;overflow-y:auto;padding:6px 16px 16px;}
.rev-crumb{font-size:12.5px;color:var(--brand);font-weight:500;margin:6px 2px 10px;}
.rev-card{background:var(--card);border:1px solid var(--line-2);border-radius:20px;box-shadow:var(--shadow);padding:18px;}
.rev-q{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.65;white-space:pre-wrap;}
.rev-img-wrap{position:relative;margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--paper-2);}
.rev-img-wrap canvas,.rev-img-wrap img{width:100%;display:block;}
.mask-toggle{position:absolute;right:9px;top:9px;background:rgba(18,32,25,.82);color:#fff;font-size:12px;padding:6px 12px;border-radius:99px;}
.rev-think{margin-top:14px;}
.rev-think textarea{width:100%;min-height:78px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px;outline:none;line-height:1.6;}
.reveal-btn{width:100%;min-height:48px;border:1.5px solid var(--brand);color:var(--brand);border-radius:12px;font-weight:500;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand-soft);}
.answer-box{margin-top:14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);padding:14px;animation:fade .3s;}
.answer-box .lab{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:6px;letter-spacing:1px;}
.answer-box .ans{font-size:15px;line-height:1.7;white-space:pre-wrap;}
.answer-box .reason{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink-2);line-height:1.7;}
.answer-box .reason b{color:var(--muted);font-weight:500;}
.rate-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px;}
.rate{border-radius:13px;padding:13px 6px;text-align:center;font-size:13px;font-weight:500;border:1.5px solid;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.rate small{font-size:11px;font-weight:400;opacity:.8;}
.rate.bad{background:var(--bad-soft);border-color:#ecc7c1;color:var(--bad);}
.rate.fuzzy{background:var(--fuzzy-soft);border-color:#ecd2a8;color:var(--fuzzy);}
.rate.good{background:var(--good-soft);border-color:#bfe0cd;color:var(--good);}
.skip-row{margin-top:10px;text-align:center;}
.text-btn{color:var(--muted);font-size:13.5px;min-height:40px;padding:0 14px;}
.rev-foot{padding:0 16px calc(14px + var(--safe-bottom));}
.rev-done{text-align:center;padding:40px 26px;}
.rev-done .ring{width:96px;height:96px;border-radius:50%;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--brand);}
.rev-done .ring svg{width:48px;height:48px;}
.rev-done h2{font-family:var(--serif);font-size:23px;margin-bottom:8px;}
.rev-done p{color:var(--muted);font-size:14px;margin-bottom:6px;}
.rev-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0;}
.rev-sum div{background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:13px 4px;}
.rev-sum b{font-family:var(--serif);font-size:22px;display:block;}
.rev-sum span{font-size:11.5px;color:var(--muted);}

/* 详情页时间线 */
.timeline{margin-top:4px;}
.tl-item{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-2);font-size:13.5px;}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none;}
.tl-item .tl-main{flex:1;}
.tl-item .tl-time{color:var(--muted);font-size:12px;}
.detail-img{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:10px 0;position:relative;background:var(--paper-2);}
.detail-img canvas{width:100%;display:block;}
.kv{display:flex;gap:10px;font-size:14px;padding:9px 0;border-bottom:1px dashed var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{width:64px;color:var(--muted);flex:none;font-size:13px;padding-top:1px;}
.kv .v{flex:1;white-space:pre-wrap;}
.list-filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.list-filter::-webkit-scrollbar{display:none;}
.list-filter .chip{flex:none;min-height:34px;align-items:center;display:flex;}
.set-item{display:flex;align-items:center;gap:13px;width:100%;padding:15px 16px;background:var(--card);border-bottom:1px solid var(--line-2);text-align:left;min-height:56px;}
.set-item:first-child{border-radius:var(--r-lg) var(--r-lg) 0 0;}
.set-item:last-child{border-radius:0 0 var(--r-lg) var(--r-lg);border-bottom:none;}
.set-group{border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--line-2);margin-bottom:16px;}
.set-item svg{width:21px;height:21px;color:var(--brand);flex:none;}
.set-item .si-txt{flex:1;}
.set-item .si-txt b{display:block;font-size:14.5px;font-weight:500;}
.set-item .si-txt span{font-size:12px;color:var(--muted);}
.set-item .chev{color:var(--faint);}
/* 多选导出 */
.pickbox{width:23px;height:23px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;transition:.15s;}
.pickbox svg{width:14px;height:14px;opacity:0;}
.q-card.picked{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset;}
.q-card.picked .pickbox{background:var(--brand);border-color:var(--brand);}
.q-card.picked .pickbox svg{opacity:1;}
.q-head{display:flex;align-items:center;gap:7px;}
.sel-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;background:var(--brand-soft);border:1px solid var(--brand);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:12px;flex-wrap:wrap;}
.sel-bar b{color:var(--brand);font-size:14px;flex:1;}
.sel-bar .btn{padding:8px 14px;font-size:13px;min-height:38px;}
/* 编辑页标签点选 */
.tag-row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 2px;}
.tag-pick{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);min-height:34px;display:inline-flex;align-items:center;gap:4px;}
.tag-pick.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.tag-pick.add{color:var(--brand);border-style:dashed;}
.mt-item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line-2);}
.mt-item span{flex:1;font-size:14px;}
.mt-item .icon-btn{flex:none;color:var(--bad);}
.mt-list{max-height:46vh;overflow:auto;margin-bottom:14px;}

/* ===== 深色模式 ===== */
:root{--bg:#F4F6F1;--card:#fff;--ink:#1a2a24;--ink-2:#5a6b62;--muted:#8a9a90;--line:#e2e8e0;--line-2:#eef2ec;--brand:#1E5A47;--brand-deep:#123B2E;--brand-soft:#E3EEE8;--accent:#CE5028;--hi:#F6D778;--good:#2E8A54;--fuzzy:#D08A1B;--bad:#C94637;--shadow:0 2px 12px rgba(30,90,71,.08);}
[data-theme="dark"]{--bg:#0f1a16;--card:#17241e;--ink:#e8efe9;--ink-2:#a8b8ae;--muted:#6a7a70;--line:#2a3a32;--line-2:#1f2e27;--brand:#3a8a6e;--brand-deep:#1a3a2e;--brand-soft:#1a2e26;--accent:#e07040;--hi:#c9a840;--good:#4aaa6e;--fuzzy:#d09a30;--bad:#d06050;--shadow:0 2px 12px rgba(0,0,0,.3);}
[data-theme="dark"] body{background:var(--bg);}
[data-theme="dark"] .q-card,[data-theme="dark"] .set-item,[data-theme="dark"] .modal,[data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] select{background:var(--card);color:var(--ink);border-color:var(--line);}
[data-theme="dark"] .searchbar{background:var(--card);border-color:var(--line);}
[data-theme="dark"] .chip{background:var(--card);border-color:var(--line);color:var(--ink-2);}
[data-theme="dark"] .tag-pick{background:var(--card);border-color:var(--line);color:var(--ink-2);}
[data-theme="dark"] .sel-bar{background:var(--brand-soft);border-color:var(--brand);}
[data-theme="dark"] .stat-card,[data-theme="dark"] .goal-ring-wrap{background:var(--card);border-color:var(--line);}
[data-theme="dark"] .exam-timer{background:var(--card);}

/* ===== 动效 ===== */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes flipIn{from{opacity:0;transform:rotateX(-12deg) translateY(10px)}to{opacity:1;transform:rotateX(0) translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ringFill{from{stroke-dashoffset:var(--ring-len)}to{stroke-dashoffset:var(--ring-off)}}
.view{animation:fadeIn .25s ease;}
.q-card{animation:slideUp .35s ease both;}
.q-card:nth-child(2){animation-delay:.04s}.q-card:nth-child(3){animation-delay:.08s}.q-card:nth-child(4){animation-delay:.12s}.q-card:nth-child(5){animation-delay:.16s}
.q-card:active{transform:scale(.985);transition:transform .12s;}
.btn:active,.flat-btn:active,.chip:active,.tag-pick:active,.set-item:active{transform:scale(.96);transition:transform .1s;}
.modal{animation:popIn .28s cubic-bezier(.2,.9,.3,1.2);}
.overlay{animation:fadeIn .2s ease;}
.rev-card{animation:flipIn .4s ease;}
.rev-card.revealed{animation:slideInRight .35s ease;}
.toast.show{animation:slideUp .25s ease;}

/* ===== 统计页 ===== */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;}
.stat-card .num{font-size:26px;font-weight:700;color:var(--brand);font-family:var(--font-serif);line-height:1.2;}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:3px;}
.stat-card.accent .num{color:var(--accent);}
.stat-card.good .num{color:var(--good);}
.stat-card.fuzzy .num{color:var(--fuzzy);}
.stat-section{margin-bottom:16px;}
.stat-section h4{font-size:14px;color:var(--ink-2);margin:0 0 10px;font-weight:600;}
.subj-bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.subj-bar .name{width:70px;font-size:12.5px;color:var(--ink-2);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.subj-bar .track{flex:1;height:14px;background:var(--line-2);border-radius:7px;overflow:hidden;}
.subj-bar .fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-deep));border-radius:7px;transition:width .6s ease;}
.subj-bar .cnt{width:32px;text-align:right;font-size:12px;color:var(--muted);flex:none;}
.trend-svg{width:100%;height:130px;}

/* ===== 每日目标环形进度 ===== */
.goal-ring-wrap{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;}
.goal-ring{position:relative;width:88px;height:88px;flex:none;}
.goal-ring svg{transform:rotate(-90deg);}
.goal-ring .ring-bg{fill:none;stroke:var(--line-2);stroke-width:8;}
.goal-ring .ring-fg{fill:none;stroke:var(--brand);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s ease;}
.goal-ring .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.goal-ring .ring-center b{font-size:20px;font-weight:700;color:var(--brand);font-family:var(--font-serif);}
.goal-ring .ring-center span{font-size:10px;color:var(--muted);}
.goal-info{flex:1;}
.goal-info .gt{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.goal-info .gd{font-size:12px;color:var(--muted);line-height:1.6;}
.goal-info .cheer{font-size:13px;color:var(--accent);font-weight:600;margin-top:6px;}

/* ===== 星标 ===== */
.star-btn{flex:none;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted);background:transparent;border:none;cursor:pointer;min-height:34px;}
.star-btn.on{color:var(--hi);}
.star-btn svg{width:18px;height:18px;}
.q-card .star-btn{position:absolute;top:8px;right:8px;z-index:2;}
.q-card{position:relative;}

/* ===== 筛选条 ===== */
.filter-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;align-items:center;}
.filter-bar .chip{min-height:32px;padding:5px 12px;font-size:12px;}

/* ===== 自由刷题 / 限时考试 配置弹层 ===== */
.mode-config .opt-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.mode-config .opt-btn{flex:1;min-width:60px;padding:10px 6px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink-2);font-size:13px;cursor:pointer;min-height:42px;}
.mode-config .opt-btn.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600;}
.mode-config .sec-label{font-size:12px;color:var(--muted);margin:10px 0 6px;font-weight:600;}

/* ===== 限时考试 ===== */
.exam-timer{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px;margin-bottom:12px;}
.exam-timer .time{font-size:22px;font-weight:700;color:var(--accent);font-family:var(--font-serif);}
.exam-timer .time.warn{color:var(--bad);animation:pulse 1s infinite;}
.exam-timer .prog{font-size:12px;color:var(--muted);}
.exam-q{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-bottom:10px;}
.exam-q .eq-num{font-size:12px;color:var(--brand);font-weight:600;margin-bottom:6px;}
.exam-q .eq-title{font-size:14px;color:var(--ink);line-height:1.6;margin-bottom:8px;}
.exam-q textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;background:var(--bg);color:var(--ink);resize:vertical;}
.exam-result{text-align:center;padding:20px 0;}
.exam-result .score{font-size:48px;font-weight:700;color:var(--brand);font-family:var(--font-serif);}
.exam-result .score-label{font-size:13px;color:var(--muted);margin-bottom:16px;}
.exam-result .er-row{display:flex;justify-content:center;gap:24px;margin:12px 0;}
.exam-result .er-item{text-align:center;}
.exam-result .er-item b{font-size:20px;color:var(--ink);display:block;}
.exam-result .er-item span{font-size:11px;color:var(--muted);}

/* ===== 震动反馈（仅视觉提示） ===== */
.vibrate-hint{font-size:11px;color:var(--muted);}

/* ===== 滚动惯性 ===== */
#app,.modal,.mt-list,.sel-bar{-webkit-overflow-scrolling:touch;overflow-y:auto;}

/* ============================================================
   二、IndexedDB 本地存储层（全部数据只存本机）
   ============================================================ */
const DB_NAME="moti_notebook",STORE="questions",METAKEY="__meta__";
let idbPromise;
function openDB(){
  if(idbPromise)return idbPromise;
  idbPromise=new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"id"});};
    r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e.target.error);
  });
  return idbPromise;
}
async function idbOp(mode,fn){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,mode),os=tx.objectStore(STORE);
    let out;try{out=fn(os);}catch(err){rej(err);return;}
    tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);
  });
}
const dbAll=()=>idbOp("readonly",os=>new Promise((res,rej)=>{const r=os.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
const dbPut=q=>idbOp("readwrite",os=>os.put(q));
const dbGet=id=>idbOp("readonly",os=>new Promise((res,rej)=>{const r=os.get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
const dbDel=id=>idbOp("readwrite",os=>os.delete(id));
const dbClear=()=>idbOp("readwrite",os=>os.clear());
async function dbBulkPut(arr){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE,"readwrite"),os=tx.objectStore(STORE);arr.forEach(o=>os.put(o));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

/* ============================================================
   三、全局状态 & 间隔重复（SRS）算法
   ============================================================ */
const state={questions:[],meta:{workspace:"我的错题本",tagLibrary:[],darkMode:"auto",dailyGoal:5,createdAt:Date.now()},route:"today",params:{}};
/* 兼容旧数据：补全题目图/答案图结构与标签库 */
function blankImg(){return {data:null,strokes:[],w:0,h:0};}
function normalizeQ(q){if(q.starred===undefined)q.starred=false;
  q.image=q.image&&typeof q.image==="object"?q.image:blankImg();
  q.image.strokes=q.image.strokes||[];
  q.answerImg=q.answerImg&&typeof q.answerImg==="object"?q.answerImg:blankImg();
  q.answerImg.strokes=q.answerImg.strokes||[];
  q.tags=Array.isArray(q.tags)?q.tags:[];
  q.reviews=Array.isArray(q.reviews)?q.reviews:[];
  return q;
}
async function loadAll(){
  state.questions=(await dbAll()).map(q=>q.id===METAKEY?q:normalizeQ(q));
  const meta=state.questions.find(q=>q.id===METAKEY);
  if(meta){state.meta=meta;state.meta.tagLibrary=Array.isArray(state.meta.tagLibrary)?state.meta.tagLibrary:[];state.questions=state.questions.filter(q=>q.id!==METAKEY);}
  else await saveMeta();
}
async function saveMeta(){await dbPut({id:METAKEY,...state.meta});}
function upsert(q){const i=state.questions.findIndex(x=>x.id===q.id);if(i>=0)state.questions[i]=q;else state.questions.unshift(q);return dbPut(q);}

/* 评分：1=还不会 2=有点模糊 3=熟练；0=跳过（不改排期） */
function schedule(q,rating,now=Date.now()){
  q=q||{ease:2.3,interval:0,reps:0,due:now};
  q.ease=q.ease||2.3;q.interval=q.interval||0;q.reps=q.reps||0;
  q.lastReview=now;
  if(rating===1){q.reps=0;q.interval=1;q.ease=Math.max(1.5,q.ease-0.25);}
  else if(rating===2){q.reps+=1;q.interval=Math.max(2,Math.round((q.interval||1)*1.4));q.ease=Math.max(1.5,q.ease-0.05);}
  else if(rating===3){q.reps+=1;if(q.reps===1)q.interval=1;else if(q.reps===2)q.interval=3;else q.interval=Math.max(3,Math.round((q.interval||1)*q.ease));q.ease=Math.min(2.8,q.ease+0.1);}
  q.due=now+q.interval*DAY;
  return q;
}
function isDue(q,t=Date.now()){return q.status!=="inbox"&&(!q.due||q.due<=dayStart(t)+DAY-1);}
function masteryOf(q){
  if(!q.reviews||!q.reviews.length)return{label:"未复习",cls:"st-inbox",color:"var(--faint)",level:0};
  if((q.interval||0)>=21)return{label:"已掌握",cls:"st-ok",color:"var(--good)",level:3};
  const last=q.reviews[q.reviews.length-1].rating;
  if(last===1)return{label:"待加强",cls:"st-due",color:"var(--bad)",level:1};
  if(last===2)return{label:"巩固中",cls:"st-inbox",color:"var(--fuzzy)",level:2};
  return{label:"巩固中",cls:"st-inbox",color:"var(--fuzzy)",level:2};
}
function calcStreak(){
  const days=new Set();
  state.questions.forEach(q=>(q.reviews||[]).forEach(r=>days.add(dayStart(r.time))));
  let streak=0,cur=dayStart();
  if(!days.has(cur))cur=dayStart(Date.now()-DAY);
  while(days.has(cur)){streak++;cur-=DAY;}
  return streak;
}

/* ============================================================
   四、图片压缩（截图/拍照 -> 压缩 dataURL 存本机）
   ============================================================ */
async function compressImage(file,maxEdge=1500){
  // 兜底：任何压缩路径失败，直接读原始 dataURL，保证图片一定能存进去
  const rawFallback=()=>new Promise((res,rej)=>{
    const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file);
  });
  try{
    let srcW,srcH,draw;
    // createImageBitmap 加 3 秒超时，防止部分浏览器卡住不返回
    try{
      if(window.createImageBitmap){
        const bmp=await Promise.race([
          createImageBitmap(file,{imageOrientation:"from-image"}),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error("bitmap timeout")),3000))
        ]);
        srcW=bmp.width;srcH=bmp.height;draw=(ctx,w,h)=>ctx.drawImage(bmp,0,0,w,h);
      }
    }catch(e){/* 回退到下方 Image */}
    if(!draw){
      const url=URL.createObjectURL(file);
      await new Promise((res,rej)=>{const img=new Image();
      img.onload=()=>{srcW=img.width;srcH=img.height;draw=(ctx,w,h)=>ctx.drawImage(img,0,0,w,h);res();};
      img.onerror=rej;img.src=url;setTimeout(()=>rej(new Error("img timeout")),5000);});
    }
    const k=Math.min(1,maxEdge/Math.max(srcW,srcH));
    const w=Math.max(1,Math.round(srcW*k)),h=Math.max(1,Math.round(srcH*k));
    const c=document.createElement("canvas");c.width=w;c.height=h;
    const ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,w,h);draw(ctx,w,h);
    return c.toDataURL("image/jpeg",0.82);
  }catch(e){
    console.warn("压缩失败，使用原图兜底",e);
    return await rawFallback();
  }
}

/* ============================================================
   七、图片批注器（原图不改，批注作为独立图层保存）
   ============================================================ */
let Annotator=null;
function openAnnotator(target){
  target=target||"question";
  const d=editDraft;if(!d){toast("请先上传图片");return;}
  const imgObj=target==="answer"?d.answerImg:d.image;
  if(!imgObj||!imgObj.data){toast(target==="answer"?"请先上传答案图片":"请先上传题目图片");return;}
  const layer=$("#layer");
  layer.innerHTML=`<div class="annotate-wrap">
    <div class="anno-top"><button class="icon-btn" id="annoExit">${I.close}</button><b>${target==="answer"?"批注答案图":"批注题目图"}</b>
      <button class="icon-btn" id="annoUndo" title="撤销">${I.back}</button></div>
    <div class="anno-stage"><canvas id="annoCanvas"></canvas></div>
    <div class="anno-tools">
      <div class="tools">
        <button class="tool on" data-t="pen">${I.pen}<span>画笔</span></button>
        <button class="tool" data-t="hl">${I.hl}<span>荧光笔</span></button>
        <button class="tool" data-t="arrow">${I.arrow}<span>箭头</span></button>
        <button class="tool" data-t="rect">${I.rect}<span>矩形</span></button>
        <button class="tool" data-t="text">${I.text}<span>文字</span></button>
        <button class="tool" data-t="mask">${I.mask}<span>遮挡</span></button>
      </div>
      <div class="anno-row">
        <span class="color-dot on" data-c="#1B2420" style="background:#1B2420"></span>
        <span class="color-dot" data-c="#C9362A" style="background:#C9362A"></span>
        <span class="color-dot" data-c="#1D56B3" style="background:#1D56B3"></span>
        <span class="sp"></span>
        <button id="annoClear">清空</button>
        <button id="annoSave">保存批注</button>
      </div>
    </div></div>`;
  const canvas=$("#annoCanvas"),ctx=canvas.getContext("2d");
  const img=new Image();
  let strokes=JSON.parse(JSON.stringify(imgObj.strokes||[]));
  let DW=0,DH=0,dpr=Math.min(2,window.devicePixelRatio||1);
  let tool="pen",color="#1B2420",cur=null,drawing=false;
  img.onload=()=>{
    const stageW=Math.min(window.innerWidth,480)-20;
    const stageH=window.innerHeight-220;
    let k=Math.min(stageW/img.width,stageH/img.height,1.6);
    DW=Math.round(img.width*k);DH=Math.round(img.height*k);
    canvas.style.width=DW+"px";canvas.style.height=DH+"px";
    canvas.width=DW*dpr;canvas.height=DH*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    redraw();
  };
  img.onerror=()=>{toast("图片加载失败，请重新上传");console.error("annotator img load error",imgObj.data&&imgObj.data.slice(0,50));};
  img.src=imgObj.data;
  function redraw(){ctx.clearRect(0,0,DW,DH);ctx.drawImage(img,0,0,DW,DH);strokes.forEach(drawStroke);if(cur)drawStroke(cur);}
  function drawStroke(s){
    ctx.save();
    ctx.lineCap="round";ctx.lineJoin="round";
    if(s.type==="hl"){ctx.globalAlpha=.42;ctx.strokeStyle=s.color;ctx.lineWidth=15;pathStroke(s);}
    else if(s.type==="pen"){ctx.strokeStyle=s.color;ctx.lineWidth=2.6;pathStroke(s);}
    else if(s.type==="arrow"){ctx.strokeStyle=s.color;ctx.lineWidth=2.6;arrow(s);}
    else if(s.type==="rect"){ctx.strokeStyle=s.color;ctx.lineWidth=2.4;const[a,b]=s.points[0],[c,e]=s.points[s.points.length-1];ctx.strokeRect(a*DW,b*DH,(c-a)*DW,(e-b)*DH);}
    else if(s.type==="mask"){ctx.globalAlpha=.94;ctx.fillStyle="#222A25";const[a,b]=s.points[0],[c,e]=s.points[s.points.length-1];ctx.fillRect(a*DW,b*DH,(c-a)*DH*0+(c-a)*DW,(e-b)*DH);}
    else if(s.type==="text"){ctx.globalAlpha=1;ctx.fillStyle=s.color;ctx.font="600 17px 'Noto Sans SC',sans-serif";ctx.textBaseline="top";ctx.fillText(s.text,s.x*DW,s.y*DH);}
    ctx.restore();
  }
  function pathStroke(s){if(s.points.length<2){const[x,y]=s.points[0];ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(x*DW,y*DH,1.6,0,7);ctx.fill();return;}ctx.beginPath();s.points.forEach((p,i)=>{const[x,y]=[p[0]*DW,p[1]*DH];i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();}
  function arrow(s){const[a,b]=s.points[0],[c,e]=s.points[s.points.length-1];const x=c*DW,y=e*DH,x0=a*DW,y0=b*DH;
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x,y);ctx.stroke();
    const ang=Math.atan2(y-y0,x-x0),L=13;ctx.beginPath();ctx.moveTo(x,y);
    ctx.lineTo(x-L*Math.cos(ang-.4),y-L*Math.sin(ang-.4));ctx.moveTo(x,y);ctx.lineTo(x-L*Math.cos(ang+.4),y-L*Math.sin(ang+.4));ctx.stroke();}
  function pos(e){const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(1,(e.clientX-r.left)/DW)),Math.max(0,Math.min(1,(e.clientY-r.top)/DH))];}
  canvas.addEventListener("pointerdown",e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);
    const p=pos(e);
    if(tool==="text"){const txt=prompt("输入要标注的文字：");if(txt&&txt.trim()){strokes.push({type:"text",color,x:p[0],y:p[1],text:txt.trim()});redraw();}return;}
    drawing=true;cur={type:tool,color:tool==="hl"?"#F2C84B":color,points:[p]};
  });
  canvas.addEventListener("pointermove",e=>{if(!drawing||!cur)return;e.preventDefault();cur.points.push(pos(e));redraw();});
  function end(){if(!drawing)return;drawing=false;if(cur&&cur.points.length)strokes.push(cur);cur=null;redraw();}
  canvas.addEventListener("pointerup",end);canvas.addEventListener("pointercancel",end);
  $$(".tool",layer).forEach(b=>b.onclick=()=>{tool=b.dataset.t;$$(".tool",layer).forEach(x=>x.classList.remove("on"));b.classList.add("on");});
  $$(".color-dot",layer).forEach(b=>b.onclick=()=>{color=b.dataset.c;$$(".color-dot",layer).forEach(x=>x.classList.remove("on"));b.classList.add("on");});
  $("#annoUndo").onclick=()=>{strokes.pop();redraw();};
  $("#annoClear").onclick=()=>{if(confirm("清空这张图上的全部批注？原图不受影响")){strokes=[];redraw();}};
  $("#annoExit").onclick=()=>{layer.innerHTML="";render();};
  $("#annoSave").onclick=()=>{try{
    imgObj.strokes=strokes;imgObj.w=img.width||imgObj.w||0;imgObj.h=img.height||imgObj.h||0;
    layer.innerHTML="";toast("批注已保存（原图未改动）");render();
  }catch(err){console.error(err);layer.innerHTML="";toast("已保存");}};
}

/* 只读绘制批注（详情/复习），imgObj={data,strokes}；showMask 控制是否显示遮挡块 */
function drawReadOnly(canvas,imgObj,showMask){
  if(!imgObj||!imgObj.data)return;
  const ctx=canvas.getContext("2d");const img=new Image();
  img.onload=()=>{
    const w=canvas.clientWidth||canvas.parentElement.clientWidth;const k=w/img.width;const h=img.height*k;
    const dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.style.height=h+"px";canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.drawImage(img,0,0,w,h);
    (imgObj.strokes||[]).forEach(s=>{if(s.type==="mask"&&!showMask)return;drawRO(ctx,s,w,h);});
  };img.src=imgObj.data;
}
function drawRO(ctx,s,w,h){
  ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
  if(s.type==="hl"){ctx.globalAlpha=.42;ctx.strokeStyle=s.color;ctx.lineWidth=15*w/400+6;lineRO(ctx,s,w,h);}
  else if(s.type==="pen"){ctx.strokeStyle=s.color;ctx.lineWidth=2.6;lineRO(ctx,s,w,h);}
  else if(s.type==="arrow"){ctx.strokeStyle=s.color;ctx.lineWidth=2.6;const[a,b]=s.points[0],[c,e]=s.points[s.points.length-1];ctx.beginPath();ctx.moveTo(a*w,b*h);ctx.lineTo(c*w,e*h);ctx.stroke();}
  else if(s.type==="rect"){ctx.strokeStyle=s.color;ctx.lineWidth=2.4;const[a,b]=s.points[0],[c,e]=s.points[s.points.length-1];ctx.strokeRect(a*w,b*h,(c-a)*w,(e-b)*h);}
  else if(s.type==="mask"){ctx.globalAlpha=.94;ctx.fillStyle="#222A25";const[a,b]=s.points[0],[c,e]=s.points[s.points.length-1];ctx.fillRect(a*w,b*h,(c-a)*w,(e-b)*h);}
  else if(s.type==="text"){ctx.fillStyle=s.color;ctx.font="600 17px 'Noto Sans SC',sans-serif";ctx.textBaseline="top";ctx.fillText(s.text,s.x*w,s.y*h);}
  ctx.restore();
}
function lineRO(ctx,s,w,h){if(s.points.length<2)return;ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(p[0]*w,p[1]*h):ctx.moveTo(p[0]*w,p[1]*h));ctx.stroke();}

/* ============================================================
   八、复习流程
   ============================================================ */
let review=null;
function startReview(ids,practice){
  let queue;
  if(ids&&ids.length)queue=state.questions.filter(q=>ids.includes(q.id));
  else queue=state.questions.filter(isDue);
  if(!queue.length){toast(practice?"题库为空":"现在没有到期的题");return;}
  review={queue:queue,idx:0,startAll:Date.now(),startCur:Date.now(),revealed:false,showMask:true,showAnsMask:true,summary:{1:0,2:0,3:0,0:0},results:[],practice:!!practice};
  vibrate(10);showReview();
}
function showReview(){
  if(review.idx>=review.queue.length)return reviewDone();
  const q=review.queue[review.idx];
  review.revealed=false;review.showMask=true;review.showAnsMask=true;review.startCur=Date.now();
  const layer=$("#layer");
  const hasMask=q.image&&(q.image.strokes||[]).some(s=>s.type==="mask");
  const img=q.image&&q.image.data?`<div class="rev-img-wrap"><canvas id="revCanvas"></canvas>${hasMask?`<button class="mask-toggle" data-act="rev-mask">显示遮挡</button>`:""}</div>`:"";
  const aHasMask=q.answerImg&&(q.answerImg.strokes||[]).some(s=>s.type==="mask");
  const ansImg=q.answerImg&&q.answerImg.data?`<div class="rev-img-wrap" style="margin-top:10px"><canvas id="revAnsCanvas"></canvas>${aHasMask?`<button class="mask-toggle" data-act="rev-amask">显示答案遮挡</button>`:""}</div>`:"";
  layer.innerHTML=`<div class="review-wrap">
    <div class="rev-top"><button class="icon-btn" data-act="rev-exit">${I.close}</button>
      <div class="rev-progress"><i style="width:${review.idx/review.queue.length*100}%"></i></div>
      <span class="timer" id="revTimer">00:00</span></div>
    <div class="rev-body">
      <div class="rev-crumb">${review.practice?"自由刷题 · ":""}${esc([q.exam,q.subject,q.chapter].filter(Boolean).join(" / ")||"未分类")} · 第 ${review.idx+1}/${review.queue.length} 题</div>
      <div class="rev-card">
        <div class="rev-q">${esc(q.title||"（本题为图片题）")}</div>
        ${img}
        <div class="rev-think"><textarea id="thinkInput" placeholder="先不看答案，在这里写下你的解题思路（选填，会记入复习记录）"></textarea></div>
        <button class="reveal-btn" id="revealBtn">${I.eye}显示答案，对照批改</button>
        <div id="answerArea" class="hidden">
          <div class="answer-box">
            <div class="lab">正确答案 / 解析</div><div class="ans">${esc(q.answer)||(q.answerImg&&q.answerImg.data?"见下方答案图":"（未填写答案）")}</div>
            ${ansImg}
            ${q.reason?`<div class="reason"><b>当初错因：</b>${esc(q.reason)}</div>`:""}
          </div>
          <div class="rate-grid">
            <button class="rate bad" data-rate="1">还不会<small>明天再见</small></button>
            <button class="rate fuzzy" data-rate="2">有点模糊<small>隔几天复习</small></button>
            <button class="rate good" data-rate="3">熟练掌握<small>拉长间隔</small></button>
          </div>
        </div>
      </div>
      <div class="skip-row" id="skipRow"><button class="text-btn" data-act="rev-skip">暂时跳过这题</button></div>
    </div>
    <div class="rev-foot"></div>
  </div>`;
  if(q.image&&q.image.data)requestAnimationFrame(()=>drawReadOnly($("#revCanvas"),q.image,true));
  clearInterval(review.timer);let t0=Date.now();
  review.timer=setInterval(()=>{const el=$("#revTimer");if(!el){clearInterval(review.timer);return;}const s=Math.floor((Date.now()-t0)/1000);const p=n=>String(n).padStart(2,"0");el.textContent=`${p(Math.floor(s/60))}:${p(s%60)}`;},500);
}
function revealAnswer(){
  review.revealed=true;
  $("#revealBtn").classList.add("hidden");$("#answerArea").classList.remove("hidden");
  const q=review.queue[review.idx];
  if(q.answerImg&&q.answerImg.data)requestAnimationFrame(()=>drawReadOnly($("#revAnsCanvas"),q.answerImg,review.showAnsMask));
}
async function rateCurrent(rating){
  const q=review.queue[review.idx];
  const duration=(Date.now()-review.startCur)/1000;
  const note=($("#thinkInput")||{value:""}).value.trim();
  vibrate(8);
  if(!review.practice){
    q.reviews=q.reviews||[];q.reviews.push({time:Date.now(),duration,rating,note});
    if(rating===0){/* 跳过：不排期 */}else schedule(q,rating);
    q.updatedAt=Date.now();if(rating>0)q.status="organized";
    await upsert(q);
  }
  review.summary[rating]++;review.results.push({id:q.id,rating});
  review.idx++;showReview();
}
function reviewDone(){
  clearInterval(review.timer);
  const total=review.queue.length,dur=(Date.now()-review.startAll)/1000;
  const s=review.summary;
  $("#layer").innerHTML=`<div class="review-wrap"><div class="rev-body"><div class="rev-done">
    <div class="ring">${I.check}</div>
    <h2>${review.practice?"练手完成！":"这一组过完了"}</h2>
    <p>${review.practice?"自由刷题不影响复习计划 · ":""}共 ${total} 题 · 用时 ${fmtDur(dur)}</p>
    <div class="rev-sum">
      <div><b style="color:var(--good)">${s[3]}</b><span>熟练</span></div>
      <div><b style="color:var(--fuzzy)">${s[2]}</b><span>模糊</span></div>
      <div><b style="color:var(--bad)">${s[1]}</b><span>不会</span></div>
    </div>
    <button class="btn btn-primary" id="revFinish">完成</button>
    </div></div></div>`;
  $("#revFinish").onclick=()=>{$("#layer").innerHTML="";review=null;go(review.practice?"library":"today");};
}

/* 通用文件保存：iOS Safari/WKWebView 用系统分享面板（存储到文件），桌面/安卓用标准下载 */
async function saveBlobFile(blob,filename,okTip){
  // 1) iOS：navigator.share 分享文件 → 用户可选「存储到文件」，规避 WebKitBlobResource 错误
  try{
    const file=new File([blob],filename,{type:blob.type||"application/octet-stream"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:filename});
      if(okTip)toast(okTip);return;
    }
  }catch(e){ if(e&&e.name==="AbortError")return; console.warn("share失败，转标准下载",e); }
  // 2) 标准下载（桌面浏览器 / 安卓 Chrome）
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},2000);
    if(okTip)toast(okTip);return;
  }catch(e){console.error("标准下载失败",e);}
  // 3) 兜底：data URI 打开后由用户保存
  const fr=new FileReader();
  fr.onload=()=>{const w=window.open();if(w)w.location.href=fr.result;toast("请在弹出页面用「分享 → 存储到文件」保存");};
  fr.readAsDataURL(blob);
}

async function exportBackup(qs){
  const questions=qs||state.questions;
  const part=qs&&qs.length!==state.questions.length;
  const data={app:"moti_notebook",version:1,exportedAt:Date.now(),meta:state.meta,questions};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const stamp=fmtFull(Date.now()).slice(0,10).replace(/-/g,"");
  const name=part?`错题精选_${questions.length}题_${stamp}.json`:`错题本备份_${stamp}.json`;
  saveBlobFile(blob,name,part?`已导出选中 ${questions.length} 题`:"备份已导出");
}
function importBackup(file){
  const fr=new FileReader();
  fr.onload=async()=>{try{
    const data=JSON.parse(fr.result);
    if(data.app!=="moti_notebook"||!Array.isArray(data.questions))throw new Error("格式不符");
    confirmDialog("恢复备份","将用备份文件覆盖当前设备上的全部数据，确定继续吗？",async()=>{
      await dbClear();
      state.questions=(data.questions||[]).map(normalizeQ);
      state.meta=data.meta||state.meta;state.meta.tagLibrary=Array.isArray(state.meta.tagLibrary)?state.meta.tagLibrary:[];
      await dbBulkPut([{id:METAKEY,...state.meta},...state.questions]);
      await loadAll();render();toast("备份已恢复");
    });
  }catch(err){toast("备份文件无法识别");}};
  fr.readAsText(file);
}

function viewStats(){
  const organized=state.questions.filter(q=>q.status!=="inbox");
  const total=state.questions.length,inbox=state.questions.filter(q=>q.status==="inbox").length;
  const mastered=organized.filter(q=>masteryOf(q).level===3).length;
  const due=organized.filter(isDue).length;
  const reviews=state.questions.reduce((s,q)=>s+(q.reviews?q.reviews.length:0),0);
  const starred=state.questions.filter(q=>q.starred).length;
  const streak=calcStreak();
  const masteryRate=organized.length?Math.round(mastered/organized.length*100):0;
  // 科目分布
  const subjMap={};
  organized.forEach(q=>{const s=q.subject||"未分科";subjMap[s]=(subjMap[s]||0)+1;});
  const subjEntries=Object.entries(subjMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxSubj=subjEntries.length?subjEntries[0][1]:1;
  const subjBars=subjEntries.map(([s,c])=>`<div class="subj-bar"><span class="name">${esc(s)}</span><div class="track"><div class="fill" style="width:${c/maxSubj*100}%"></div></div><span class="cnt">${c}</span></div>`).join("");
  // 最近7天复习趋势
  const days=[];const now=new Date();
  for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);d.setHours(0,0,0,0);days.push({label:`${d.getMonth()+1}/${d.getDate()}`,start:d.getTime(),count:0});}
  state.questions.forEach(q=>(q.reviews||[]).forEach(r=>{const d=days.find(x=>r.time>=x.start&&r.time<x.start+86400000);if(d)d.count++;}));
  const maxCount=Math.max(1,...days.map(d=>d.count));
  const W=320,H=120,pad=24;
  const pts=days.map((d,i)=>[pad+i*(W-2*pad)/(days.length-1),H-pad-d.count/maxCount*(H-2*pad)]);
  const pathD=pts.map((p,i)=>i?`L${p[0].toFixed(1)},${p[1].toFixed(1)}`:`M${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  const areaD=pathD+` L${pts[pts.length-1][0].toFixed(1)},${H-pad} L${pts[0][0].toFixed(1)},${H-pad} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--brand)"><title>${days[i].label}: ${days[i].count}次</title></circle>`).join("");
  const xLabels=days.map((d,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${H-6}" font-size="9" fill="var(--muted)" text-anchor="middle">${d.label}</text>`).join("");
  return shell(`<div class="view">
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${total}</div><div class="lbl">题库总量</div></div>

      <div style="height:10px;background:var(--line-2);border-radius:5px;overflow:hidden"><div style="height:100%;width:${masteryRate}%;background:linear-gradient(90deg,var(--brand),var(--good));border-radius:5px;transition:width .8s"></div></div></div>

      <svg class="trend-svg" viewBox="0 0 ${W} ${H}">
        <defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--brand)" stop-opacity=".3"/><stop offset="100%" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
        <path d="${areaD}" fill="url(#trendGrad)"/>
        <path d="${pathD}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}${xLabels}
      </svg></div>

  </div>`,{title:"学习统计",sub:"总览 · 科目 · 趋势",back:true,tab:false});
}

/* ---------- 多格式导出 ---------- */
function exportQuestions(qs,format){
  const stamp=fmtFull(Date.now()).slice(0,10).replace(/-/g,"");
  const download=(content,type,ext)=>{
    const blob=new Blob([content],{type});
    saveBlobFile(blob,`错题本_${qs.length}题_${stamp}.${ext}`,`已导出 ${qs.length} 题（${ext.toUpperCase()}）`);
  };
  if(format==="json"){exportBackup(qs);return;}
  if(format==="md"){
    let md=`# 错题本导出（${qs.length}题）\n\n导出时间：${fmtFull(Date.now())}\n\n---\n\n`;
    qs.forEach((q,i)=>{
      md+=`## ${i+1}. ${q.title||"（无标题）"}\n\n`;
      md+=`- **考试**：${q.exam||"—"} · **科目**：${q.subject||"—"} · **章节**：${q.chapter||"—"}\n`;
      if(q.tags&&q.tags.length)md+=`- **标签**：${q.tags.join("、")}\n`;
      if(q.starred)md+=`- ⭐ 星标\n`;
      md+=`\n**题目**：\n${q.title||"（见图片）"}\n\n`;
      md+=`**答案/解析**：\n${q.answer||"（未填写）"}\n\n`;
      if(q.reason)md+=`**错因**：${q.reason}\n\n`;
      md+=`**复习记录**：${(q.reviews||[]).length}次，掌握度：${masteryOf(q).label}\n\n---\n\n`;
    });
    download(md,"text/markdown;charset=utf-8","md");return;
  }
  if(format==="csv"){
    const escCsv=s=>`"${(s||"").replace(/"/g,'""').replace(/\n/g," ")}"`;
    let csv="序号,考试,科目,章节,题干,答案,错因,标签,星标,复习次数,掌握度\n";
    qs.forEach((q,i)=>{
      csv+=`${i+1},${escCsv(q.exam)},${escCsv(q.subject)},${escCsv(q.chapter)},${escCsv(q.title)},${escCsv(q.answer)},${escCsv(q.reason)},${escCsv((q.tags||[]).join("|"))},${q.starred?"是":"否"},${(q.reviews||[]).length},${masteryOf(q).label}\n`;
    });
    download("\ufeff"+csv,"text/csv;charset=utf-8","csv");return;
  }
  if(format==="txt"){
    let txt=`错题本导出（共${qs.length}题）\n导出时间：${fmtFull(Date.now())}\n${"=".repeat(40)}\n\n`;
    qs.forEach((q,i)=>{
      txt+=`【第${i+1}题】${q.title||"（无标题）"}\n`;
      txt+=`分类：${[q.exam,q.subject,q.chapter].filter(Boolean).join(" / ")||"未分类"}\n`;
      if(q.tags&&q.tags.length)txt+=`标签：${q.tags.join("、")}\n`;
      txt+=`\n题目：\n${q.title||"（见图片）"}\n\n`;
      txt+=`答案：\n${q.answer||"（未填写）"}\n\n`;
      if(q.reason)txt+=`错因：${q.reason}\n`;
      txt+=`${"-".repeat(40)}\n\n`;
    });
    download(txt,"text/plain;charset=utf-8","txt");return;
  }
}
function exportFormatDialog(qs){
  window._exportList=qs;
  const isPart=qs.length!==state.questions.length;
  $("#layer").innerHTML=`<div class="overlay center" data-act="close-layer"><div class="modal">
    <h3>导出 ${isPart?"选中 ":""}${qs.length} 题 · 选择格式</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.6">Markdown / CSV / 纯文本不含图片，适合喂给 AI 组卷；JSON 含图片和批注，用于完整备份。</p>
    <button class="btn btn-primary" style="width:100%;margin-bottom:8px" data-act="export-fmt" data-fmt="md">${I.edit} Markdown（推荐，AI 组卷友好）</button>
    <button class="btn btn-ghost" style="width:100%;margin-bottom:8px" data-act="export-fmt" data-fmt="csv">${I.chart} CSV（表格软件可打开）</button>
    <button class="btn btn-ghost" style="width:100%;margin-bottom:8px" data-act="export-fmt" data-fmt="txt">${I.text} 纯文本</button>
    <button class="btn btn-ghost" style="width:100%;margin-bottom:8px" data-act="export-fmt" data-fmt="json">${I.export} JSON 完整备份（含图片批注）</button>
    <button class="btn btn-ghost" style="width:100%" data-act="close-layer">取消</button></div></div>`;
}

/* ---------- 限时考试 ---------- */
let exam=null;
function examConfig(){
  const total=state.questions.filter(q=>q.status!=="inbox").length;
  if(!total){toast("题库为空，先收录题目");return;}
  window._examCount=Math.min(10,total);window._examDur=10;
  const renderDlg=()=>{
    const counts=[5,10,20,30,total].filter((v,i,a)=>v<=total&&a.indexOf(v)===i);
    const durs=[5,10,20,30,45,60];
    $("#layer").innerHTML=`<div class="overlay center" data-act="close-layer"><div class="modal mode-config">
      <h3>限时考试</h3>
      <p style="font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.6">从题库随机抽题，倒计时答题，交卷后出成绩单。不影响复习计划。</p>
      <div class="sec-label">题目数量（题库共 ${total} 题）</div>
      <div class="opt-row">${counts.map(c=>`<button class="opt-btn ${window._examCount===c?"on":""}" data-exam-count="${c}">${c===total?"全部":c+"题"}</button>`).join("")}</div>
      <div class="sec-label">考试时长</div>
      <div class="opt-row">${durs.map(d=>`<button class="opt-btn ${window._examDur===d?"on":""}" data-exam-dur="${d}">${d}分钟</button>`).join("")}</div>
      <button class="btn btn-primary" style="width:100%;margin-top:14px" id="examStart">${I.timer}开始考试</button>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px" data-act="close-layer">取消</button></div></div>`;
    document.querySelectorAll("[data-exam-count]").forEach(b=>b.onclick=()=>{window._examCount=+b.dataset.examCount;renderDlg();});
    document.querySelectorAll("[data-exam-dur]").forEach(b=>b.onclick=()=>{window._examDur=+b.dataset.examDur;renderDlg();});
    $("#examStart").onclick=()=>startExam(window._examCount,window._examDur);
  };
  renderDlg();
}
function startExam(count,durMin){
  let pool=state.questions.filter(q=>q.status!=="inbox").slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const list=pool.slice(0,count);
  exam={list,idx:0,answers:new Array(list.length).fill(""),startAt:Date.now(),duration:durMin*60*1000,timer:null};
  vibrate(20);showExam();
}
function showExam(){
  if(exam.idx>=exam.list.length)return examSubmit();
  const q=exam.list[exam.idx];
  const remain=Math.max(0,exam.duration-(Date.now()-exam.startAt));
  const mm=String(Math.floor(remain/60000)).padStart(2,"0");
  const ss=String(Math.floor(remain%60000/1000)).padStart(2,"0");
  const warn=remain<60000;
  const img=q.image&&q.image.data?`<div class="detail-img" style="margin:8px 0"><img src="${q.image.data}" style="max-width:100%;border-radius:8px" alt=""></div>`:"";
  $("#layer").innerHTML=`<div class="review-wrap">
    <div class="exam-timer">
      <div><div class="time ${warn?"warn":""}" id="examTime">${mm}:${ss}</div>
      <div class="prog">第 ${exam.idx+1}/${exam.list.length} 题 · ${q.subject||"未分科"}</div></div>
      <div style="display:flex;gap:8px">
        ${exam.idx>0?`<button class="btn btn-ghost" id="examPrev" style="padding:8px 14px">上一题</button>`:""}
        <button class="btn btn-primary" id="examNext">${exam.idx===exam.list.length-1?"交卷":"下一题"}</button>
      </div>
    </div>
    <div class="exam-q">
      <div class="eq-num">第 ${exam.idx+1} 题</div>
      <div class="eq-title">${esc(q.title||"（见图片）")}</div>
      ${img}
      <textarea id="examAnswer" placeholder="在此写下你的答案（选填，交卷后对照）">${esc(exam.answers[exam.idx]||"")}</textarea>
    </div>
    <div style="text-align:center;padding:10px"><button class="text-btn" id="examJump">跳转题目</button></div>
  </div>`;
  const ta=$("#examAnswer");if(ta)ta.addEventListener("input",()=>{exam.answers[exam.idx]=ta.value;});
  if($("#examPrev"))$("#examPrev").onclick=()=>{exam.answers[exam.idx]=($("#examAnswer")||{value:""}).value;exam.idx--;showExam();};
  $("#examNext").onclick=()=>{exam.answers[exam.idx]=($("#examAnswer")||{value:""}).value;exam.idx++;showExam();};
  $("#examJump").onclick=()=>{
    const nums=exam.list.map((_,i)=>i+1).join("、");
    promptDialog("跳转到第几题？",`共${exam.list.length}题：${nums}`,v=>{const n=parseInt(v);if(n&&n>=1&&n<=exam.list.length){exam.answers[exam.idx]=($("#examAnswer")||{value:""}).value;exam.idx=n-1;showExam();}});
  };
  clearInterval(exam.timer);
  exam.timer=setInterval(()=>{
    const el=$("#examTime");if(!el){clearInterval(exam.timer);return;}
    const r=Math.max(0,exam.duration-(Date.now()-exam.startAt));
    el.textContent=`${String(Math.floor(r/60000)).padStart(2,"0")}:${String(Math.floor(r%60000/1000)).padStart(2,"0")}`;
    if(r<60000)el.classList.add("warn");else el.classList.remove("warn");
    if(r<=0){clearInterval(exam.timer);examSubmit();}
  },500);
}
function examSubmit(){
  clearInterval(exam.timer);
  const used=Date.now()-exam.startAt;
  const answered=exam.answers.filter(a=>a&&a.trim()).length;
  const total=exam.list.length;
  $("#layer").innerHTML=`<div class="overlay center" data-act="close-layer"><div class="modal" style="max-width:420px">
    <div class="exam-result">
      <div class="score">${answered}/${total}</div>
      <div class="score-label">已作答题目数</div>
      <div class="er-row">
        <div class="er-item"><b>${fmtDur(used/1000)}</b><span>用时</span></div>
        <div class="er-item"><b>${total-answered}</b><span>未作答</span></div>
      </div>
      <p style="font-size:12.5px;color:var(--muted);line-height:1.7;margin:12px 0">考试结束！请对照下方题目自行批改。本次考试不影响复习计划。</p>
    </div>
    <div class="section-title" style="margin-top:8px">题目回顾<span class="line"></span></div>
    ${exam.list.map((q,i)=>`<div class="exam-q" style="padding:10px 12px">
      <div class="eq-num">第 ${i+1} 题 ${exam.answers[i]&&exam.answers[i].trim()?"":"· 未作答"}</div>
      <div class="eq-title" style="font-size:13.5px">${esc(q.title||"（见图片）")}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px"><b>你的答案：</b>${esc(exam.answers[i]||"（未作答）")}</div>
      <div style="font-size:12px;color:var(--good);margin-top:4px"><b>正确答案：</b>${esc(q.answer||"（未填写）")}</div>
    </div>`).join("")}
    <button class="btn btn-primary" style="width:100%;margin-top:14px" id="examFinish">完成</button>
  </div></div>`;
  $("#examFinish").onclick=()=>{$("#layer").innerHTML="";exam=null;go("library");};
}
